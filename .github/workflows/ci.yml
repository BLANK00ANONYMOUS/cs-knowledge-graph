name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -c constraints.txt -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q
        env:
          KG_NO_KEYRING: "1"
      - name: Vault check
        run: python tools/kg.py check
